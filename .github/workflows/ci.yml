name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,web,stripe,llm,mcp]"
      - name: Check dependencies
        run: python -m pip check
      - name: Run test suite
        run: python -m pytest

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build
      - name: Install wheel outside the checkout
        run: |
          python -m venv /tmp/arbiter-smoke
          /tmp/arbiter-smoke/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed package
        run: |
          cd /tmp
          /tmp/arbiter-smoke/bin/python -c "import arbiter; assert arbiter.__version__ == '0.1.0'"
          /tmp/arbiter-smoke/bin/arbiter-demo --help
